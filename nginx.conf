# Veil Private XRP Payments - Nginx Configuration for Cloud Run
# Optimized for SPA routing and large ZK artifact delivery

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/wasm;

    # Don't gzip already compressed files (zkey is binary)
    gzip_disable "msie6";

    server {
        # Cloud Run injects PORT environment variable
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CSP allowing external RPC endpoints and Axelar APIs
        # Note: Axelar SDK uses multiple endpoints for gas estimation and status
        # Updated 2026-02-01: Added api.gmp.axelarscan.io and AWS S3 for Axelar config
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://xrplcluster.com https://*.xrpl.org https://rpc.xrplevm.org https://rpc.testnet.xrplevm.org https://*.xrplevm.org https://api.axelarscan.io https://api.gmp.axelarscan.io https://testnet.api.axelarscan.io https://*.axelarscan.io https://*.axelar.dev https://*.axelarnetwork.io https://lcd-axelar.imperator.co https://axelar-mainnet-lcd.quasar.fi https://*.amazonaws.com https://v2.api.squidrouter.com https://apiplus.squidrouter.com https://*.squidrouter.com wss: ws:; worker-src 'self' blob:; child-src 'self' blob:;" always;

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ZK artifacts - special handling for large files
        location /zk/ {
            # Enable range requests for large files
            add_header Accept-Ranges bytes;

            # Long cache - these files don't change
            expires 1y;
            add_header Cache-Control "public, immutable";

            # CORS for potential worker fetch
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";

            # Proper MIME types
            types {
                application/wasm wasm;
                application/octet-stream zkey;
                application/json json;
                application/javascript js;
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }
    }
}

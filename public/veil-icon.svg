<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Veil Privacy Icon - Shield with Lock -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M32 4 L56 12 L56 28 C56 44 44 54 32 60 C20 54 8 44 8 28 L8 12 Z"
        fill="url(#shieldGrad)"
        stroke="#c9a227"
        stroke-width="2"/>

  <!-- Lock body -->
  <rect x="22" y="30" width="20" height="16" rx="2"
        fill="url(#lockGrad)"/>

  <!-- Lock shackle -->
  <path d="M26 30 L26 24 C26 20 28 18 32 18 C36 18 38 20 38 24 L38 30"
        fill="none"
        stroke="#c9a227"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="32" cy="36" r="3" fill="#1a1a2e"/>
  <rect x="31" y="36" width="2" height="6" fill="#1a1a2e"/>
</svg>
